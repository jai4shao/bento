<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🏬 店家與菜單管理</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 p-4 md:p-8">
  <div class="max-w-4xl mx-auto space-y-6">

    <!-- 頂部卡片 -->
    <header class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-bold text-slate-800">🏬 店家與菜單管理</h1>
        <p class="text-xs text-slate-500 mt-1">管理配合店家資訊、供餐切換與菜單品項</p>
      </div>
      <div class="space-x-2">
        <a href="/" class="text-xs font-medium text-slate-600 hover:text-slate-900 bg-slate-100 hover:bg-slate-200 px-3 py-2 rounded-lg transition">返回前台</a>
        <a href="/admin" class="text-xs font-medium text-blue-600 hover:text-blue-800 bg-blue-50 hover:bg-blue-100 px-3 py-2 rounded-lg transition">收款對帳</a>
      </div>
    </header>

    <!-- 新增店家表單 -->
    <section class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 space-y-4">
      <h2 class="text-lg font-bold text-slate-800 border-b pb-2">➕ 新增合作店家</h2>
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
        <input type="text" id="newStoreName" placeholder="店家名稱（如：正忠排骨）" class="border border-slate-300 rounded-xl px-3.5 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500">
        <input type="text" id="newStorePhone" placeholder="電話（選填）" class="border border-slate-300 rounded-xl px-3.5 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500">
        <input type="text" id="newStoreCategory" placeholder="分類（如：便當、麵食）" class="border border-slate-300 rounded-xl px-3.5 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <button onclick="addStore()" class="w-full sm:w-auto bg-slate-800 hover:bg-slate-900 text-white text-sm font-semibold px-5 py-2.5 rounded-xl transition">
        建立新店家
      </button>
    </section>

    <!-- 店家清單容器 -->
    <div id="storeContainer" class="space-y-6">
      <div class="bg-white rounded-2xl p-8 text-center text-slate-400">載入店家與菜單中...</div>
    </div>

  </div>

  <script>
    async function loadStores() {
      try {
        const res = await fetch('/api/init-order-page');
        const json = await res.json();
        if (!json.success) throw new Error();

        const { stores, menuItems } = json.data;
        const container = document.getElementById('storeContainer');

        if (!stores || stores.length === 0) {
          container.innerHTML = '<div class="bg-white rounded-2xl p-8 text-center text-slate-400">目前尚無店家資料，請使用上方表單建立第一間店家。</div>';
          return;
        }

        container.innerHTML = stores.map(s => {
          const items = menuItems.filter(m => m.store_id === s.id);
          return `
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 space-y-4">
              <div class="flex flex-col sm:flex-row justify-between sm:items-center gap-3 border-b pb-4">
                <div>
                  <div class="flex items-center space-x-2">
                    <h3 class="text-xl font-bold text-slate-800">${s.name}</h3>
                    <span class="text-xs font-semibold px-2 py-0.5 rounded ${s.is_active ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-200 text-slate-600'}">
                      ${s.is_active ? '供餐中' : '休息中'}
                    </span>
                  </div>
                  <p class="text-xs text-slate-500 mt-1">電話：${s.phone || '未提供'} ｜ 分類：${s.category || '一般'}</p>
                </div>
                <div class="flex items-center space-x-2">
                  <button onclick="toggleStore(${s.id}, ${s.is_active ? 0 : 1})" class="text-xs font-semibold px-3 py-1.5 rounded-lg border ${s.is_active ? 'border-amber-300 bg-amber-50 text-amber-700 hover:bg-amber-100' : 'border-emerald-300 bg-emerald-50 text-emerald-700 hover:bg-emerald-100'} transition">
                    ${s.is_active ? '切換為休息' : '設為今日供餐'}
                  </button>
                  <button onclick="addMenuItemPrompt(${s.id}, '${s.name}')" class="text-xs font-semibold px-3 py-1.5 rounded-lg bg-blue-50 text-blue-700 hover:bg-blue-100 transition">
                    ➕ 新增餐點
                  </button>
                </div>
              </div>

              <!-- 菜單列表 -->
              <div>
                <h4 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">菜單品項 (${items.length})</h4>
                ${items.length === 0 ? '<p class="text-xs text-slate-400 py-2">尚未新增餐點品項，點擊上方「➕ 新增餐點」開始建立。</p>' : `
                  <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2 text-sm">
                    ${items.map(it => `
                      <div class="flex justify-between items-center bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2">
                        <span class="font-medium text-slate-700">${it.item_name}</span>
                        <span class="font-bold text-blue-600">$${it.price}</span>
                      </div>
                    `).join('')}
                  </div>
                `}
              </div>
            </div>
          `;
        }).join('');

      } catch (err) {
        document.getElementById('storeContainer').innerHTML = '<div class="bg-white rounded-2xl p-8 text-center text-red-500">讀取店家資料失敗</div>';
      }
    }

    async function addStore() {
      const name = document.getElementById('newStoreName').value.trim();
      const phone = document.getElementById('newStorePhone').value.trim();
      const category = document.getElementById('newStoreCategory').value.trim();

      if (!name) return alert('請輸入店家名稱！');

      const res = await fetch('/api/store/add', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, phone, category })
      });
      const result = await res.json();
      if (result.success) {
        alert('店家新增成功！');
        document.getElementById('newStoreName').value = '';
        document.getElementById('newStorePhone').value = '';
        document.getElementById('newStoreCategory').value = '';
        loadStores();
      } else {
        alert(result.message || '新增失敗');
      }
    }

    async function toggleStore(storeId, isActive) {
      await fetch('/api/store/toggle', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ storeId, isActive })
      });
      loadStores();
    }

    async function addMenuItemPrompt(storeId, storeName) {
      const itemName = prompt(`請輸入要在 [${storeName}] 新增的品項名稱：`);
      if (!itemName || !itemName.trim()) return;

      const priceStr = prompt(`請輸入 [${itemName}] 的價格（整數）：`, '100');
      if (!priceStr || isNaN(Number(priceStr))) return alert('請輸入有效的價格數字！');

      const res = await fetch('/api/menu/add', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ storeId, itemName: itemName.trim(), price: Number(priceStr) })
      });
      const result = await res.json();
      if (result.success) {
        loadStores();
      } else {
        alert(result.message || '新增餐點失敗');
      }
    }

    loadStores();
  </script>
</body>
</html>
