
<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>訂單管理控制台</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root { --primary: #2563eb; --accent: #ea580c; --bg: #faf6ee; --card: #ffffff; --border: #ebdccb; }
    body { background: var(--bg); color: #1c1917; padding: 20px; max-width: 1040px; margin: 0 auto; font-family: system-ui, sans-serif; }
    .card-custom { background: var(--card); border: 1.5px solid var(--border); border-radius: 14px; padding: 20px; margin-bottom: 24px; }
  </style>
</head>
<body>

  <div class="d-flex gap-3 mb-3">
    <a href="index.html" class="fw-bold text-decoration-none">&larr; 前往點餐前台</a>
    <a href="store_admin.html" class="fw-bold text-decoration-none" style="color:var(--accent);">🏪 店家管理 &rarr;</a>
  </div>

  <h1 class="h3 mb-3 fw-bold">訂餐管理與排程控制台</h1>

  <!-- 叫餐統計 -->
  <div class="card-custom">
    <h2 class="h5 fw-bold mb-3">📞 餐點叫餐統計 (依店家分開)</h2>
    <div id="summaryContainer">載入中...</div>
  </div>

  <!-- 同學收款核銷清單 -->
  <div class="card-custom">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2 class="h5 fw-bold mb-0">📋 同學訂購明細與收款核銷</h2>
      <button class="btn btn-outline-danger btn-sm" onclick="resetAllOrders()">🔄 清空本週點餐</button>
    </div>
    <table class="table align-middle">
      <thead>
        <tr>
          <th>姓名</th>
          <th>品項 (店家 / 備註)</th>
          <th>應收</th>
          <th style="width: 130px;">已繳金額</th>
          <th>對帳狀態</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="ordersTableBody">
        <tr><td colspan="6" class="text-center text-muted py-3">載入訂單中...</td></tr>
      </tbody>
    </table>
  </div>

  <!-- 修改 Modal -->
  <div class="modal fade" id="updateItemModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">修改品項明細</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="modalOrderId">
          <div class="mb-3">
            <label class="form-label small fw-bold">品項名稱</label>
            <input type="text" class="form-control" id="modalItemName" readonly>
          </div>
          <div class="mb-3">
            <label class="form-label small fw-bold">自訂備註</label>
            <input type="text" class="form-control" id="modalNote">
          </div>
          <div class="mb-3">
            <label class="form-label small fw-bold">單價</label>
            <input type="number" class="form-control" id="modalPrice">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
          <button type="button" class="btn btn-primary" onclick="submitItemUpdate()">儲存更新</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    let updateModalInstance;

    async function loadData() {
      // 1. 載入統計
      const sumRes = await fetch('/api/admin/summary');
      const sumJson = await sumRes.json();
      renderSummary(sumJson.data || []);

      // 2. 載入訂單清單
      const ordRes = await fetch('/api/admin/orders');
      const ordJson = await ordRes.json();
      renderOrders(ordJson.data || []);
    }

    function renderSummary(rows) {
      const container = document.getElementById('summaryContainer');
      if (rows.length === 0) {
        container.innerHTML = '<div class="text-muted text-center py-3">目前尚無登記資料</div>';
        return;
      }
      // 依店家分組
      const groups = {};
      rows.forEach(r => {
        if (!groups[r.store_name]) groups[r.store_name] = { phone: r.store_phone, items: [], totalQty: 0, totalAmount: 0 };
        groups[r.store_name].items.push(r);
        groups[r.store_name].totalQty += r.qty;
        groups[r.store_name].totalAmount += r.subtotal;
      });

      let html = '';
      for (const [name, g] of Object.entries(groups)) {
        html += `
          <div class="border rounded p-3 mb-3">
            <div class="d-flex justify-content-between mb-2 pb-2 border-bottom">
              <strong>🍱 ${name} ${g.phone ? `(${g.phone})` : ''}</strong>
              <span class="text-primary fw-bold">小計：${g.totalQty} 份 / $${g.totalAmount} 元</span>
            </div>
            <table class="table table-sm mb-0">
              <thead><tr><th>品項</th><th>備註</th><th>單價</th><th>數量</th><th>小計</th></tr></thead>
              <tbody>
                ${g.items.map(i => `
                  <tr>
                    <td>${i.item_name}</td>
                    <td>${i.note ? `<span class="badge bg-warning text-dark">${i.note}</span>` : '<span class="text-muted small">無</span>'}</td>
                    <td>$${i.price}</td>
                    <td class="fw-bold text-danger">${i.qty}</td>                     <td>$${i.subtotal}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `;
      }
      container.innerHTML = html;
    }

    function renderOrders(orders) {
      const tbody = document.getElementById('ordersTableBody');
      if (orders.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-3">尚無訂購資料</td></tr>';
        return;
      }

      tbody.innerHTML = orders.map(o => `
        <tr id="order-row-${o.id}" data-order-id="${o.id}" data-price="${o.price}" data-cancelled="0">
          <td><strong>${o.user_name}</strong></td>
          <td>
            <span class="item-text">${o.item_name} <small class="text-muted">(${o.store_name} / ${o.note || '無'})</small></span>
          </td>
          <td class="payable-amount">$${o.price}</td>
          <td>
            <input type="number" class="form-control form-control-sm paid-input" value="${o.paid_amount || 0}" min="0" oninput="calculateBalance(${o.id})">
          </td>
          <td><span class="badge status-badge bg-danger">計算中</span></td>
          <td>
            <button class="btn btn-sm btn-warning me-1" onclick="openUpdateModal(${o.id}, '${o.item_name}', '${o.note || ''}', ${o.price})">修改</button>
            <button class="btn btn-sm btn-outline-danger cancel-btn" onclick="toggleCancelItem(${o.id})">取消</button>
          </td>
        </tr>
      `).join('');

      orders.forEach(o => calculateBalance(o.id, false));
    }

    function calculateBalance(orderId, triggerSync = true) {
      const row = document.getElementById(`order-row-${orderId}`);
      if (!row) return;

      const isCancelled = row.getAttribute('data-cancelled') === '1';
      const payable = isCancelled ? 0 : (parseInt(row.getAttribute('data-price')) || 0);
      const paid = parseInt(row.querySelector('.paid-input').value) || 0;
      const statusBadge = row.querySelector('.status-badge');

      row.querySelector('.payable-amount').innerText = `$${payable}`;

      let isPaid = 0;
      if (paid === payable && payable > 0) {
        statusBadge.className = 'badge bg-success status-badge';
        statusBadge.innerText = '🟢 付款完成';
        isPaid = 1;
      } else if (paid > payable) {
        statusBadge.className = 'badge bg-primary status-badge';
        statusBadge.innerText = `🔵 應退 $${paid - payable}`;
        isPaid = 1;
      } else {
        statusBadge.className = 'badge bg-danger status-badge';
        statusBadge.innerText = `🔴 欠款 $${payable - paid}`;
        isPaid = 0;
      }

      if (triggerSync) {
        fetch('/api/admin/order/paid', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ orderId, paidAmount: paid, isPaid })
        });
      }
    }

    function toggleCancelItem(orderId) {
      const row = document.getElementById(`order-row-${orderId}`);
      const isCancelled = row.getAttribute('data-cancelled') === '1';
      const itemText = row.querySelector('.item-text');
      const cancelBtn = row.querySelector('.cancel-btn');

      if (!isCancelled) {
        itemText.style.textDecoration = 'line-through';
        itemText.style.color = 'gray';
        row.setAttribute('data-cancelled', '1');
        cancelBtn.innerText = '恢復';
        cancelBtn.className = 'btn btn-sm btn-outline-secondary cancel-btn';
      } else {
        itemText.style.textDecoration = 'none';
        itemText.style.color = 'initial';
        row.setAttribute('data-cancelled', '0');
        cancelBtn.innerText = '取消';
        cancelBtn.className = 'btn btn-sm btn-outline-danger cancel-btn';
      }
      calculateBalance(orderId);
    }

    function openUpdateModal(orderId, itemName, note, price) {
      document.getElementById('modalOrderId').value = orderId;
      document.getElementById('modalItemName').value = itemName;
      document.getElementById('modalNote').value = note;
      document.getElementById('modalPrice').value = price;
      updateModalInstance = new bootstrap.Modal(document.getElementById('updateItemModal'));
      updateModalInstance.show();
    }

    async function submitItemUpdate() {
      const orderId = document.getElementById('modalOrderId').value;
      const note = document.getElementById('modalNote').value;
      const price = parseInt(document.getElementById('modalPrice').value) || 0;

      const res = await fetch('/api/admin/order/update', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ orderId, note, price })
      });

      if (res.ok) {
        updateModalInstance.hide();
        loadData(); // 重新整理資料
      }
    }

    async function resetAllOrders() {
      if (!confirm('確定要清空本週所有同學的點餐紀錄嗎？')) return;
      await fetch('/api/admin/orders/reset', { method: 'POST' });
      loadData();
    }

    document.addEventListener('DOMContentLoaded', loadData);
  </script>
</body>
</html>
