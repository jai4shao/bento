<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>便當系統 - 管理後台與核銷</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 p-4 md:p-8">
  <div class="max-w-6xl mx-auto space-y-6">

    <header class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 flex flex-col sm:flex-row justify-between sm:items-center gap-4">
      <div>
        <div class="flex items-center space-x-2">
          <h1 class="text-2xl font-bold text-slate-800">📋 便當訂單核銷與統計</h1>
          <span id="lockStatusBadge" class="text-xs font-bold px-2.5 py-1 rounded-full border">載入中...</span>
        </div>
        <p class="text-xs text-slate-500 mt-1">電話下單後請點擊「截止點餐」，支援店家分卡報單與炸物滷味個人分袋打包</p>
      </div>
      <div class="flex items-center flex-wrap gap-2">
        <button id="toggleLockBtn" onclick="toggleOrderLock()" class="text-xs font-bold px-4 py-2 rounded-xl border shadow-sm transition">
          切換狀態中...
        </button>
        <a href="/" class="text-xs font-semibold text-slate-600 hover:text-slate-900 bg-slate-100 hover:bg-slate-200 px-3.5 py-2 rounded-xl border border-slate-200 transition">回點餐前台</a>
        <a href="/store_admin" class="text-xs font-semibold text-slate-600 hover:text-slate-900 bg-slate-100 hover:bg-slate-200 px-3.5 py-2 rounded-xl border border-slate-200 transition">店家管理</a>
        <button onclick="resetAllOrders()" class="text-xs font-semibold text-red-600 hover:text-red-800 bg-red-50 hover:bg-red-100 px-3.5 py-2 rounded-xl border border-red-200 transition">清空所有訂單</button>
      </div>
    </header>

    <!-- 1. 叫餐統計區塊 (獨立店家分卡 + 合併叫餐分袋) -->
    <section class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 space-y-5">
      <div class="flex justify-between items-center border-b pb-3">
        <div>
          <h2 class="text-lg font-bold text-slate-800">📊 店家叫餐報單統計</h2>
          <p class="text-xs text-slate-500 mt-0.5">依各店家獨立成卡，電話報單一目了然（合併叫餐已自動移至下方分袋清單）</p>
        </div>
        <span class="text-xs bg-blue-50 text-blue-700 font-bold px-3 py-1 rounded-full border border-blue-100" id="totalSummaryAmount">全單總額：$0</span>
      </div>

      <!-- 🍱 一般店家叫餐卡片容器 (依店家分卡) -->
      <div id="storeCallCardsContainer" class="space-y-4">
        <p class="text-slate-400 py-4 text-center text-sm">載入叫餐統計中...</p>
      </div>

      <!-- 🛍️ 合併點餐專用叫餐區 (滷味、炸物、車輪餅等個人分袋裝) -->
      <div id="bundledStoresContainer" class="space-y-3 pt-2"></div>
    </section>

    <!-- 2. 個人對帳核銷 (依人合併) -->
    <section class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-lg font-bold text-slate-800">🧾 個人對帳找零 (依人員加總)</h2>
        <span class="text-xs text-slate-500 font-medium">💡 輸入一次實收金額，自動試算找零並全額結清</span>
      </div>
      <div id="userOrdersContainer" class="overflow-x-auto text-sm">
        <p class="text-slate-400 py-4 text-center">載入對帳名單中...</p>
      </div>
    </section>

  </div>

  <!-- 修改訂單彈窗 (同店品項過濾) -->
  <div id="editModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-6 space-y-4">
      <div class="flex justify-between items-center border-b pb-3">
        <div>
          <h3 class="text-lg font-bold text-slate-800">修改餐點品項</h3>
          <p id="modalStoreIndicator" class="text-xs text-blue-600 font-bold mt-0.5"></p>
        </div>
        <button onclick="closeEditModal()" class="text-slate-400 hover:text-slate-600 text-lg">&times;</button>
      </div>
      <div class="space-y-3 text-sm">
        <div>
          <label class="block font-semibold text-slate-700 mb-1">點餐人</label>
          <input type="text" id="modalUserName" disabled class="w-full bg-slate-100 border border-slate-200 rounded-xl px-3 py-2 text-slate-500">
        </div>
        <div>
          <label class="block font-semibold text-slate-700 mb-1">更換該店家品項</label>
          <select id="modalMenuSelect" onchange="onModalMenuChange()" class="w-full border border-slate-300 rounded-xl px-3 py-2 bg-slate-50 focus:bg-white outline-none focus:ring-2 focus:ring-blue-500">
          </select>
        </div>
        <div>
          <label class="block font-semibold text-slate-700 mb-1">金額 ($)</label>
          <input type="number" id="modalPrice" class="w-full border border-slate-300 rounded-xl px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div>
          <label class="block font-semibold text-slate-700 mb-1">備註需求</label>
          <input type="text" id="modalNote" placeholder="微糖微冰、飯少等" class="w-full border border-slate-300 rounded-xl px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
      </div>
      <div class="flex justify-end space-x-2 pt-3 border-t">
        <button onclick="closeEditModal()" class="px-4 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded-xl transition">取消</button>
        <button onclick="saveOrderEdit()" class="px-4 py-2 text-xs font-semibold bg-blue-600 hover:bg-blue-700 text-white rounded-xl shadow transition">儲存更新</button>
      </div>
    </div>
  </div>

  <script>
    let rawOrders = [];
    let availableMenuItems = [];
    let allStoresList = [];
    let activeEditingOrderId = null;
    let isCurrentlyLocked = false;

    async function loadAdminData() {
      try {
        const [initRes, sumRes, ordRes, statusRes] = await Promise.all([
          fetch('/api/init-order-page'),
          fetch('/api/admin/summary'),
          fetch('/api/admin/orders'),
          fetch('/api/system/status')
        ]);
        const initJson = await initRes.json();
        const sumJson = await sumRes.json();
        const ordJson = await ordRes.json();
        const statusJson = await statusRes.json();

        availableMenuItems = (initJson.data && initJson.data.menuItems) ? initJson.data.menuItems : [];
        allStoresList = (initJson.data && initJson.data.stores) ? initJson.data.stores : [];
        rawOrders = ordJson.data || [];
        isCurrentlyLocked = statusJson.isLocked || false;

        renderLockStatus();
        renderStoreCallCards(sumJson.data || []);
        renderBundledStoreOrders(rawOrders);
        renderUserAggregatedOrders(rawOrders);
      } catch (e) {
        console.error(e);
        document.getElementById('storeCallCardsContainer').innerHTML = '<p class="text-red-500 py-4 text-center text-sm">載入資料失敗</p>';
      }
    }

    function renderLockStatus() {
      const badge = document.getElementById('lockStatusBadge');
      const btn = document.getElementById('toggleLockBtn');

      if (isCurrentlyLocked) {
        badge.innerText = '🔴 已結單 (已截止)';
        badge.className = 'text-xs font-bold px-2.5 py-1 rounded-full border bg-red-50 text-red-700 border-red-200';
        btn.innerText = '🔓 重新開放點餐';
        btn.className = 'text-xs font-bold px-4 py-2 rounded-xl border bg-emerald-600 hover:bg-emerald-700 text-white border-emerald-600 shadow-sm transition';
      } else {
        badge.innerText = '🟢 開放登記中';
        badge.className = 'text-xs font-bold px-2.5 py-1 rounded-full border bg-emerald-50 text-emerald-700 border-emerald-200';
        btn.innerText = '🔒 截止點餐 (已向店家下單)';
        btn.className = 'text-xs font-bold px-4 py-2 rounded-xl border bg-red-600 hover:bg-red-700 text-white border-red-600 shadow-sm transition';
      }
    }

    async function toggleOrderLock() {
      const targetState = !isCurrentlyLocked;
      const confirmText = targetState 
        ? '確定要「截止點餐」嗎？\n截止後前台將無法送出點餐、也無法自己取消或修改餐點。' 
        : '確定要「重新開放點餐」嗎？';
      
      if (!confirm(confirmText)) return;

      const res = await fetch('/api/admin/toggle-lock', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ isLocked: targetState })
      });
      const json = await res.json();
      if (json.success) {
        isCurrentlyLocked = targetState;
        renderLockStatus();
        alert(json.message);
      } else {
        alert(json.message || '操作失敗');
      }
    }

    // 判斷是否為合併點餐類店家
    function isBundledCategory(cat) {
      if (!cat) return false;
      const c = cat.toLowerCase();
      return c.includes('合併點餐') || c.includes('滷味') || c.includes('炸物') || c.includes('車輪餅') || c.includes('點心');
    }

    // 1. 一般店家叫餐報單區 (依店家分卡展示，並自動過濾排除合併點餐)
    function renderStoreCallCards(summary) {
      const container = document.getElementById('storeCallCardsContainer');
      let grandTotal = 0;

      if (!summary || summary.length === 0) {
        container.innerHTML = '<p class="text-slate-400 py-4 text-center text-sm">目前無訂單統計資料</p>';
        document.getElementById('totalSummaryAmount').innerText = '全單總額：$0';
        return;
      }

      // 計算全單總額 (包含合併點餐)
      summary.forEach(s => grandTotal += (s.subtotal || 0));
      document.getElementById('totalSummaryAmount').innerText = '全單總額：$' + grandTotal;

      // 建立「店家名稱 -> 店家資料」的快取，方便查電話與分類
      const storeMetaMap = {};
      allStoresList.forEach(st => {
        storeMetaMap[st.name] = st;
      });

      // 依店家分組，但排除「合併點餐」店家
      const storeGroups = {};
      summary.forEach(row => {
        const storeName = row.store_name || '未指定店家';
        const stMeta = storeMetaMap[storeName];

        // 若該店分類屬於「合併點餐」，跳過不在此表顯示
        if (stMeta && isBundledCategory(stMeta.category)) {
          return;
        }

        if (!storeGroups[storeName]) {
          storeGroups[storeName] = {
            storeName: storeName,
            phone: stMeta ? stMeta.phone : '',
            category: stMeta ? stMeta.category : '便當',
            items: [],
            totalQty: 0,
            totalAmount: 0
          };
        }

        storeGroups[storeName].items.push(row);
        storeGroups[storeName].totalQty += Number(row.qty || 0);
        storeGroups[storeName].totalAmount += Number(row.subtotal || 0);
      });

      const storeKeys = Object.keys(storeGroups);
      if (storeKeys.length === 0) {
        container.innerHTML = '<div class="bg-slate-50 border border-slate-200 rounded-xl p-4 text-center text-slate-400 text-xs">目前無便當/飲料類餐點（所有餐點均屬下方合併分袋清單）</div>';
        return;
      }

      let html = '';
      storeKeys.forEach(sName => {
        const group = storeGroups[sName];
        const isDrink = group.category === '飲料';
        const badgeColor = isDrink ? 'bg-purple-50 text-purple-700 border-purple-200' : 'bg-blue-50 text-blue-700 border-blue-200';

        html += `
          <div class="bg-slate-50 border border-slate-200 rounded-2xl p-4 space-y-3 shadow-xs">
            <div class="flex flex-col sm:flex-row justify-between sm:items-center gap-2 border-b border-slate-200 pb-2.5">
              <div class="flex items-center space-x-2">
                <span class="text-base font-bold text-slate-800">${group.storeName}</span>
                <span class="text-[11px] font-bold px-2 py-0.5 rounded border ${badgeColor}">${group.category}</span>
                ${group.phone ? `<span class="text-xs text-slate-500 font-mono">📞 ${group.phone}</span>` : ''}
              </div>
              <div class="flex items-center space-x-2 text-xs">
                <span class="font-bold text-slate-600 bg-white border border-slate-200 px-2.5 py-1 rounded-lg">共 ${group.totalQty} 份</span>
                <span class="font-bold text-blue-700 bg-blue-100/70 border border-blue-200 px-2.5 py-1 rounded-lg">合計：$${group.totalAmount}</span>
              </div>
            </div>

            <table class="w-full text-left border-collapse text-xs">
              <thead>
                <tr class="text-slate-400 border-b border-slate-200">
                  <th class="py-1.5 px-2">品項名稱</th>
                  <th class="py-1.5 px-2">規格 / 備註</th>
                  <th class="py-1.5 px-2 text-center w-16">數量</th>
                  <th class="py-1.5 px-2 text-right w-20">小計</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-200/60">
                ${group.items.map(it => `
                  <tr class="hover:bg-white/60 transition">
                    <td class="py-2 px-2 font-bold text-slate-800">${it.item_name}</td>
                    <td class="py-2 px-2 text-slate-600 font-medium">${it.note || '-'}</td>
                    <td class="py-2 px-2 text-center font-bold text-slate-800 text-sm">${it.qty}</td>                     <td class="py-2 px-2 text-right font-bold text-slate-700">$${it.subtotal}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    // 2. 合併點餐個人分袋打包專區 (向店家報單分袋專用)
    function renderBundledStoreOrders(orders) {
      const container = document.getElementById('bundledStoresContainer');
      container.innerHTML = '';

      const bundledStores = allStoresList.filter(s => isBundledCategory(s.category));
      if (bundledStores.length === 0) return;

      bundledStores.forEach(s => {
        const storeOrders = orders.filter(o => o.store_name === s.name);
        if (storeOrders.length === 0) return;

        let storeTotal = 0;
        const userBags = {};
        storeOrders.forEach(o => {
          storeTotal += Number(o.price || 0);
          if (!userBags[o.user_name]) {
            userBags[o.user_name] = { userName: o.user_name, items: {}, bagTotal: 0 };
          }
          userBags[o.user_name].bagTotal += Number(o.price || 0);
          const key = o.item_name + (o.note ? ` (${o.note})` : '');
          userBags[o.user_name].items[key] = (userBags[o.user_name].items[key] || 0) + 1;
        });

        let bagsHtml = `
          <div class="bg-amber-50/70 border border-amber-200 rounded-2xl p-4 space-y-3">
            <div class="flex flex-col sm:flex-row justify-between sm:items-center gap-2 border-b border-amber-200 pb-2.5">
              <div class="flex items-center space-x-2">
                <span class="text-base font-bold text-amber-900 flex items-center gap-1.5">
                  <span>🛍️</span> <span>[${s.name}] 個人分袋叫餐清單</span>
                </span>
                ${s.phone ? `<span class="text-xs text-amber-700 font-mono">📞 ${s.phone}</span>` : ''}
              </div>
              <div class="flex items-center space-x-2 text-xs">
                <span class="font-bold text-amber-800 bg-amber-100 border border-amber-300 px-2.5 py-1 rounded-lg">共 ${Object.keys(userBags).length} 袋</span>
                <span class="font-bold text-amber-900 bg-amber-200/80 border border-amber-300 px-2.5 py-1 rounded-lg">店家合計：$${storeTotal}</span>
              </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2.5 text-xs pt-1">
        `;

        Object.values(userBags).forEach((bag, idx) => {
          const itemListStr = Object.entries(bag.items).map(([name, qty]) => `${name} × ${qty}`).join('、');
          bagsHtml += `
            <div class="bg-white border border-amber-200 rounded-xl p-3 space-y-1.5 shadow-2xs">
              <div class="flex justify-between items-center font-bold text-slate-800 border-b border-slate-100 pb-1">
                <span>袋子 #${idx + 1}：${bag.userName}</span>
                <span class="text-amber-700">$${bag.bagTotal}</span>
              </div>
              <p class="text-slate-600 text-[11px] leading-relaxed">${itemListStr}</p>
            </div>
          `;
        });

        bagsHtml += '</div></div>';
        container.innerHTML += bagsHtml;
      });
    }

    // 3. 個人對帳核銷清單
    function renderUserAggregatedOrders(orders) {
      const container = document.getElementById('userOrdersContainer');
      if (!orders || orders.length === 0) {
        container.innerHTML = '<p class="text-slate-400 py-4 text-center">目前尚無點餐紀錄</p>';
        return;
      }

      const usersMap = {};
      orders.forEach(o => {
        if (!usersMap[o.user_name]) {
          usersMap[o.user_name] = {
            userName: o.user_name,
            totalPrice: 0,
            paidAmount: Number(o.paid_amount || 0),
            isAllPaid: true,
            items: []
          };
        }
        usersMap[o.user_name].totalPrice += Number(o.price || 0);
        if (!o.is_paid) usersMap[o.user_name].isAllPaid = false;
        usersMap[o.user_name].items.push(o);
      });

      const userList = Object.values(usersMap);

      let html = '<table class="w-full text-left border-collapse">' +
        '<thead><tr class="border-b border-slate-200 text-slate-500 text-xs">' +
          '<th class="py-2.5 px-3">姓名</th>' +
          '<th class="py-2.5 px-3">點購內容品項 (明細/操作)</th>' +
          '<th class="py-2.5 px-3 text-center">總應付</th>' +
          '<th class="py-2.5 px-3 text-center w-28">實收金額</th>' +
          '<th class="py-2.5 px-3 text-center w-28">找零計算</th>' +
          '<th class="py-2.5 px-3 text-center">結清</th>' +
        '</tr></thead><tbody class="divide-y divide-slate-100">';

      userList.forEach(u => {
        const change = u.paidAmount > 0 ? (u.paidAmount - u.totalPrice) : 0;
        let changeBadge = '<span class="text-xs text-slate-400">未收</span>';
        if (u.paidAmount > 0) {
          if (change >= 0) {
            changeBadge = '<span class="text-xs font-bold text-emerald-600 bg-emerald-50 border border-emerald-200 px-2 py-0.5 rounded-md">應找 $' + change + '</span>';
          } else {
            changeBadge = '<span class="text-xs font-bold text-red-500 bg-red-50 border border-red-200 px-2 py-0.5 rounded-md">少收 $' + Math.abs(change) + '</span>';
          }
        }

        let itemsHtml = '<div class="space-y-1.5 py-1">';
        u.items.forEach(it => {
          itemsHtml += '<div class="flex items-center justify-between bg-slate-50 border border-slate-200 rounded-lg px-2.5 py-1 text-xs">' +
            '<div>' +
              '<span class="text-blue-600 font-semibold">[' + (it.store_name || '未指定') + ']</span> ' +
              '<span class="text-slate-700 font-medium">' + it.item_name + '</span> ' +
              (it.note ? '<span class="text-amber-700 bg-amber-50 px-1 py-0.5 rounded border border-amber-200 ml-1">' + it.note + '</span>' : '') +
              '<span class="text-slate-500 font-bold ml-1.5">$' + it.price + '</span>' +
            '</div>' +
            '<div class="space-x-1 pl-2">' +
              '<button onclick="openEditModal(' + it.id + ')" class="text-blue-600 hover:text-blue-800 font-semibold">改</button>' +
              '<button onclick="deleteOrder(' + it.id + ')" class="text-red-500 hover:text-red-700 font-semibold">刪</button>' +
            '</div>' +
          '</div>';
        });
        itemsHtml += '</div>';

        html += '<tr class="hover:bg-slate-50 transition">' +
          '<td class="py-2.5 px-3 font-bold text-slate-800 align-middle">' + u.userName + '</td>' +
          '<td class="py-2.5 px-3 align-middle">' + itemsHtml + '</td>' +
          '<td class="py-2.5 px-3 text-center font-bold text-slate-800 align-middle">$' + u.totalPrice + '</td>' +
          '<td class="py-2.5 px-3 text-center align-middle">' +
            '<input type="number" value="' + (u.paidAmount > 0 ? u.paidAmount : '') + '" placeholder="' + u.totalPrice + '" ' +
              'onblur="onUserPaidAmountChange(\'' + u.userName + '\', ' + u.totalPrice + ', this.value)" ' +
              'class="w-20 text-center border border-slate-300 rounded-lg py-1 px-1 text-sm font-semibold focus:ring-2 focus:ring-blue-500 outline-none">' +
          '</td>' +
          '<td class="py-2.5 px-3 text-center align-middle">' + changeBadge + '</td>' +
          '<td class="py-2.5 px-3 text-center align-middle">' +
            '<input type="checkbox" onchange="toggleUserPaidCheck(\'' + u.userName + '\', ' + u.totalPrice + ', this.checked)" ' + (u.isAllPaid ? 'checked' : '') + ' class="w-4 h-4 text-blue-600 rounded border-slate-300 focus:ring-blue-500 cursor-pointer">' +
          '</td>' +
        '</tr>';
      });

      html += '</tbody></table>';
      container.innerHTML = html;
    }

    async function onUserPaidAmountChange(userName, totalPrice, val) {
      const paid = Number(val || 0);
      const isPaid = paid >= totalPrice ? 1 : 0;
      await fetch('/api/admin/user/paid', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userName, paidAmount: paid, isPaid })
      });
      loadAdminData();
    }

    async function toggleUserPaidCheck(userName, totalPrice, isChecked) {
      await fetch('/api/admin/user/paid', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          userName,
          paidAmount: isChecked ? totalPrice : 0,
          isPaid: isChecked ? 1 : 0
        })
      });
      loadAdminData();
    }

    function openEditModal(orderId) {
      const order = rawOrders.find(o => o.id === orderId);
      if (!order) return;

      activeEditingOrderId = orderId;
      document.getElementById('modalUserName').value = order.user_name;
      document.getElementById('modalPrice').value = order.price;
      document.getElementById('modalNote').value = order.note || '';

      const originalItem = availableMenuItems.find(m => m.id === order.item_id);
      const targetStoreId = originalItem ? originalItem.store_id : null;
      const storeName = originalItem ? originalItem.store_name : (order.store_name || '');

      document.getElementById('modalStoreIndicator').innerText = storeName ? `店家：${storeName}` : '';

      let sameStoreItems = availableMenuItems;
      if (targetStoreId) {
        sameStoreItems = availableMenuItems.filter(m => m.store_id === targetStoreId);
      }

      const select = document.getElementById('modalMenuSelect');
      let optHtml = '';
      sameStoreItems.forEach(m => {
        const isSel = (m.id === order.item_id) ? 'selected' : '';
        optHtml += '<option value="' + m.id + '" data-price="' + m.price + '" ' + isSel + '>' +
          m.item_name + ' - $' + m.price +
        '</option>';
      });
      select.innerHTML = optHtml;
      document.getElementById('editModal').classList.remove('hidden');
    }

    function onModalMenuChange() {
      const select = document.getElementById('modalMenuSelect');
      const opt = select.options[select.selectedIndex];
      if (opt && opt.dataset.price) {
        document.getElementById('modalPrice').value = opt.dataset.price;
      }
    }

    function closeEditModal() {
      document.getElementById('editModal').classList.add('hidden');
      activeEditingOrderId = null;
    }

    async function saveOrderEdit() {
      if (!activeEditingOrderId) return;
      const itemId = Number(document.getElementById('modalMenuSelect').value);
      const price = Number(document.getElementById('modalPrice').value);
      const note = document.getElementById('modalNote').value.trim();

      const res = await fetch('/api/admin/order/update', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ orderId: activeEditingOrderId, itemId, price, note })
      });
      const json = await res.json();
      if (json.success) {
        closeEditModal();
        loadAdminData();
      } else {
        alert(json.message || '更新失敗');
      }
    }

    async function deleteOrder(orderId) {
      if (!confirm('確定要刪除這筆餐點紀錄嗎？')) return;
      const res = await fetch('/api/admin/order/delete', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ orderId })
      });
      const json = await res.json();
      if (json.success) {
        loadAdminData();
      } else {
        alert(json.message || '刪除失敗');
      }
    }

    async function resetAllOrders() {
      if (!confirm('⚠️ 警告：這將清空目前所有的訂單紀錄，確定要重置嗎？')) return;
      const res = await fetch('/api/admin/orders/reset', { method: 'POST' });
      const json = await res.json();
      alert(json.message || '已清空');
      loadAdminData();
    }

    loadAdminData();
  </script>
</body>
</html>
